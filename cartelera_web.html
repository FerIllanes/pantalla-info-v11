.cab{display:flex;justify-content:space-between;align-items:baseline;height:138px;box-sizing:border-box;padding-top:62px;border-bottom:4px solid var(--tinta)}
.cab h1{margin:0;font:700 66px/1 var(--titulo);letter-spacing:.005em}
.cab small{font:600 24px/1 var(--titulo);color:var(--tinta-suave);letter-spacing:.04em}
.sec{padding:20px 0 14px}
.sec + .sec{border-top:1px solid var(--linea-fina)}
.c2 .sec{padding:10px 0 4px}
.c2 .sec h2{line-height:1.15}
.sec h2{margin:0 0 4px;font:700 36px/1.25 var(--titulo);display:flex;align-items:baseline}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:47px}
.fila .dia{font:400 31px/47px var(--texto)}
.fila .hs{display:flex;flex-direction:column;align-items:flex-end;font:600 35px/44px var(--titulo);white-space:nowrap}
.precios .fila,.precios h2{display:grid;grid-template-columns:1fr 150px 158px;align-items:baseline;white-space:nowrap}
.precios .fila .dia{font-size:29px}
.precios .zapas h2{display:block;white-space:nowrap}
.precios h2 span{font:600 21px/1 var(--titulo);color:var(--tinta-suave);text-align:right;letter-spacing:.04em}
.precios .fila b{font:600 35px/47px var(--titulo);text-align:right;font-variant-numeric:tabular-nums}
.precios .zapas{display:flex;justify-content:space-between;align-items:baseline}
.precios .zapas b{font:600 35px/1 var(--titulo)}
.pie{position:absolute;left:44px;right:44px;bottom:30px;border-top:2px solid var(--linea-pie);padding-top:22px;font:400 25px/33px var(--texto);color:var(--tinta-suave)}
.pie p{margin:0}

<div id="escenario"><div id="cartel"></div></div>

<script>
/* ============================================================
   DATOS DE LA CARTELERA: editá solo esta parte.
   Cada fila es ["Día", "horario"] o ["Día", "horario 1", "horario 2"].
   ============================================================ */
const DATOS = {
  muroLibre: {
    titulo: "MURO LIBRE",
    secciones: [
      { nombre: "BOULDER LIBRE", filas: [
        ["Lunes", "17:00 a 22:00 hs."],
        ["Martes a viernes", "9:00 a 22:00 hs."],
        ["Sábados", "10:00 a 21:00 hs."],
        ["Domingos", "13:00 a 21:00 hs."] ] },
      { nombre: "CUERDA LIBRE", filas: [
        ["Lunes a viernes", "17:00 a 21:30 hs."],
        ["Sábados", "10:00 a 21:00 hs."],
        ["Domingos", "13:00 a 21:00 hs."] ] }
    ],
    pie: ["Mayores de 12 años, mostrando DNI.", "Menores de 16, acompañados por un adulto."]
  },
  clases: {
    titulo: "CLASES", etiqueta: "CUPOS LIMITADOS",
    secciones: [
      { nombre: "BOULDER · PRINCIPIANTES", filas: [
        ["Lunes a jueves", "10:00 a 12:00 hs."],
        ["Viernes", "14:00 a 16:00 hs."],
        ["Lunes a viernes", "17:30 a 19:30 hs.", "19:00 a 21:00 hs."] ] },
      { nombre: "BOULDER · AVANZADOS", filas: [
        ["Martes", "19:15 a 21:15 hs."] ] },
      { nombre: "CUERDA", filas: [
        ["Lun, mié y vie", "19:30 a 21:30 hs."],
        ["Sábados", "10:00 a 12:00 hs."] ] },
      { nombre: "ESCUELITA", filas: [
        ["Sábados", "10:00 a 11:30 hs."] ] },
      { nombre: "PREJUVENILES", filas: [
        ["Martes", "17:30 a 19:30 hs."],
        ["Sábados", "11:30 a 13:30 hs."] ] }
    ],
    pie: ["Cancelaciones con 24 hs de anticipación", "para poder reprogramar la clase."]
  },
  precios: {
    titulo: "PRECIOS",
    secciones: [
      { nombre: "BOULDER LIBRE", filas: [
        ["1 pase", "$15.000", "$16.667"],
        ["4 pases por mes", "$39.000", "$43.333"],
        ["8 pases por mes", "$68.000", "$75.556"],
        ["Mes libre", "$81.000", "$90.000"] ] },
      { nombre: "CLASES", filas: [
        ["1 clase", "$30.000", "$33.333"],
        ["4 clases por mes", "$68.000", "$75.556"],
        ["8 clases por mes*", "$132.000", "$146.667"],
        ["4 clases por mes + zapas", "$80.000", "$87.556"],
        ["8 clases por mes + zapas", "$156.000", "$170.667"] ] }
    ],
    zapas: "$6.000",
    pie: ["Los paquetes valen 30 días desde el primer uso.", "*El pack de 8 clases incluye pase mensual libre."]
  }
};
/* Cada cuántos minutos se recarga sola para tomar cambios */
const RECARGAR_CADA_MINUTOS = 10;
/* ============================================================ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const pie = l => `<div class="pie">${l.map(t => `<p>${esc(t)}</p>`).join("")}</div>`;
const cab = (t, e) => `<div class="cab"><h1>${esc(t)}</h1>${e ? `<small>${esc(e)}</small>` : ""}</div>`;
function horarios(d, cls) {
  const secs = d.secciones.map(s => `<div class="sec"><h2>${esc(s.nombre)}</h2>${
    s.filas.map(([dia, ...hs]) => `<div class="fila"><span class="dia">${esc(dia)}</span><span class="hs">${hs.map(h => `<span>${esc(h)}</span>`).join("")}</span></div>`).join("")}</div>`).join("");
  return `<section class="col ${cls}">${cab(d.titulo, d.etiqueta)}${secs}${pie(d.pie)}</section>`;
}
function precios(d) {
  const secs = d.secciones.map(s => `<div class="sec"><h2><span style="text-align:left;font:inherit;color:inherit;letter-spacing:0">${esc(s.nombre)}</span><span>EFECTIVO</span><span>TRANSF.</span></h2>${
    s.filas.map(([n, a, b]) => `<div class="fila"><span class="dia">${esc(n)}</span><b>${esc(a)}</b><b>${esc(b)}</b></div>`).join("")}</div>`).join("");
  return `<section class="col c3 precios">${cab(d.titulo)}${secs}<div class="sec zapas"><h2>ALQUILER DE ZAPAS</h2><b>${esc(d.zapas)}</b></div>${pie(d.pie)}</section>`;
}
const cartel = document.getElementById("cartel");
cartel.innerHTML = horarios(DATOS.muroLibre, "c1") + horarios(DATOS.clases, "c2") + precios(DATOS.precios);

/* Llena toda la ventana: escala para que entre el diseño y estira las columnas al espacio que sobra */
const escenario = document.getElementById("escenario");
function ajustar() {
  const w = escenario.clientWidth, h = escenario.clientHeight;
  const s = Math.min(w / 1920, h / 1080);
  cartel.style.width = (w / s) + "px";
  cartel.style.height = (h / s) + "px";
  cartel.style.transform = `scale(${s})`;
}
addEventListener("resize", ajustar); ajustar();

/* Clic en cualquier lado: pantalla completa */
addEventListener("click", () => { document.documentElement.requestFullscreen?.().catch(() => {}); });
/* Evita que la pantalla se apague */
async function despierta() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
despierta(); document.addEventListener("visibilitychange", () => { if (!document.hidden) despierta(); });
/* Recarga periódica para tomar cambios */
if (RECARGAR_CADA_MINUTOS > 0) setTimeout(() => location.reload(), RECARGAR_CADA_MINUTOS * 60000);
</script>
